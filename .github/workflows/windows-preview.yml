name: Build Windows preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:windows
      - name: Parse Windows speech scripts
        shell: powershell
        run: |
          Get-ChildItem src/main/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          Add-Type -AssemblyName System.Speech
          [System.Speech.Recognition.SpeechRecognitionEngine]::InstalledRecognizers() | Select-Object Id, Culture
      - run: npm run build:renderer
      - run: npm run pack:win
      - uses: actions/upload-artifact@v4
        with:
          name: EDEN-Windows-x64-preview
          path: release-public/*Setup.exe
          if-no-files-found: error
